name: 报告 Bug
description: 功能不对、报错、界面异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先确认线上版本是否也能复现：https://37lmgu7z9v2nb3yma16.traesite.cn
        抓取类问题请附上出错接口和浏览器 Network 里的状态码，方便判断是亚马逊限流还是代码问题。
  - type: input
    id: version
    attributes:
      label: 版本 / 部署方式
      description: 线上版、Docker、systemd 或本地 node，能写 commit 更好
      placeholder: 线上版 / docker / systemd / 本地 node
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 出问题的板块
      options:
        - Alexa 导购洞察 / 词海搭建
        - Listing 优化（标题 / 五点 / 关键词反查）
        - 广告搜索词分析
        - ASIN 分析 / 竞品对比
        - 利润 / 选品 / BSR
        - 部署 / API 接口
        - 其他
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 页面或接口
      description: 例如「Alexa 导购洞察」或 `/api/alexa/insight`
      placeholder: /api/alexa/insight
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、期望看到什么、实际看到什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 输入 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台或接口报错（可选）
      description: 浏览器 Console / Network 的状态码与返回体，或服务端日志尾部
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已确认线上版本可以复现
        - label: 已搜索现有 Issue，没有重复
